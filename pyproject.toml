[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "openremap/_rs/Cargo.toml"
module-name = "openremap._rust"
python-source = "."
features = ["pyo3/abi3-py310", "pyo3/extension-module"]
exclude = ["openremap/_rs/target/**"]

[tool.uv]
package = true

[project]
name = "openremap"
version = "0.6.3"
description = "ECU binary analysis and patching toolkit — diff, validate, and apply tuning recipes to automotive ECU binaries."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Natural Language :: English",
]
dependencies = [
    "typer>=0.15.0",
    "rarfile>=4.2",
    "pydantic>=2",
    "textual>=0.80",
]

[project.scripts]
openremap        = "openremap.cli.main:main"
openremap-tui    = "openremap.tui.main:run"
openremap-server = "openremap.server:main"

[project.urls]
Homepage = "https://www.openremap.com"
Documentation = "https://www.openremap.com/docs"
Repository = "https://github.com/v-arapidis/openremap-core"
"Bug Tracker" = "https://github.com/v-arapidis/openremap-core/issues"
Changelog = "https://github.com/v-arapidis/openremap-core/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
