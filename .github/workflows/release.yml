name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest tests/ -x

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: musllinux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      # Linux (glibc): use maturin directly for manylinux tags (uv build
      # forces --compatibility off which PyPI rejects). Run from project
      # root so maturin discovers both the Python package and the Rust
      # crate via pyproject.toml.
      - name: Build wheel (Linux — glibc)
        if: matrix.target == 'linux'
        run: >
          uvx maturin build --release
          --compatibility manylinux_2_34
          --out dist

      # Linux (musl): cross-compile against musl for Alpine Docker images.
      # Rust's x86_64-unknown-linux-musl target produces a binary that links
      # against musl instead of glibc.  pip on Alpine automatically selects
      # the musllinux wheel over the manylinux one.
      - name: Build wheel (Linux — musl)
        if: matrix.target == 'musllinux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          uvx maturin build --release \
            --target x86_64-unknown-linux-musl \
            --out dist

      - name: Build wheel (macOS / Windows)
        if: matrix.target != 'linux' && matrix.target != 'musllinux'
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
