name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest tests/ -x
      - run: uv run pytest tests/tuning/test_entropy_oracle.py -v

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      # Linux: use maturin directly for manylinux tags (uv build forces
      # --compatibility off which PyPI rejects). Run from project root so
      # maturin discovers both the Python package and the Rust crate via
      # pyproject.toml.
      - name: Build wheel (Linux)
        if: matrix.target == 'linux'
        run: >
          uvx maturin build --release
          --compatibility manylinux_2_34
          --out dist

      - name: Build wheel (macOS / Windows)
        if: matrix.target != 'linux'
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
