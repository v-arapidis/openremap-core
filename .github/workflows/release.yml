name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # ── Run tests first — don't publish if anything is broken ────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest tests/ -x
      - run: uv run pytest tests/tuning/test_entropy_oracle.py -v

  # ── Build platform wheels ────────────────────────────────────────────────
  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      # Linux: must use maturin directly to get manylinux tags.
      # uv build passes --compatibility off which produces linux_x86_64
      # tags that PyPI rejects.
      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: >
          uvx maturin build --release
          --manifest-path openremap/_rust/Cargo.toml
          --compatibility manylinux_2_17
          --out dist
      - name: Build wheel (macOS / Windows)
        if: runner.os != 'Linux'
        run: uv build
        env:
          MATURIN_COMPATIBILITY: "off"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # ── Publish to PyPI ──────────────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
