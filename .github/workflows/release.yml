name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # ── Run tests first — don't publish if anything is broken ────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest tests/ -x
      - run: uv run pytest tests/tuning/test_entropy_oracle.py -v

  # ── Build platform wheels ────────────────────────────────────────────────
  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            manylinux: manylinux_2_34
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      - name: Build wheel (Linux)
        if: matrix.target == 'linux'
        run: >
          uvx maturin build --release
          --manifest-path openremap/_rust/Cargo.toml
          --compatibility ${{ matrix.manylinux }}
          --out dist

      - name: Build wheel (macOS / Windows)
        if: matrix.target != 'linux'
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # ── Publish to PyPI ──────────────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
